name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Windows installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate tag version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          if ($tagVersion -ne $packageVersion) {
            throw "Tag version $tagVersion does not match package.json version $packageVersion."
          }

      - name: Typecheck
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Build installer
        run: npx electron-builder --win nsis --publish never

      - name: Publish GitHub release
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          gh release create "${{ github.ref_name }}" `
            "release/Yubblo-Setup-$version.exe" `
            "release/Yubblo-Setup-$version.exe.blockmap" `
            "release/latest.yml" `
            --verify-tag `
            --title "Yubblo $version" `
            --generate-notes `
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
